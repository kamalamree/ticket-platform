<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اختيار التذاكر - Ticket arab</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Tahoma, sans-serif;
      background: #07111F;
      color: white;
    }

    .header {
      padding: 22px 20px;
      text-align: center;
      border-bottom: 1px solid #243448;
    }

    .logo {
      color: #D4AF37;
      font-size: 28px;
      font-weight: bold;
    }

    .container {
      width: 92%;
      max-width: 900px;
      margin: 30px auto;
    }

    .event-card {
      background: #0D1B2A;
      border: 1px solid #26384D;
      border-radius: 18px;
      overflow: hidden;
      margin-bottom: 25px;
    }

    .event-image {
      width: 100%;
      display: block;
      max-height: 430px;
      object-fit: cover;
    }

    .event-info {
      padding: 22px;
    }

    .event-title {
      color: #D4AF37;
      font-size: 28px;
      margin: 0 0 12px;
    }

    .event-details {
      color: #AEB8C4;
      line-height: 1.9;
      font-size: 15px;
    }

    .tickets-title {
      margin: 30px 0 15px;
      font-size: 22px;
      color: #D4AF37;
    }

    .ticket {
      background: #0D1B2A;
      border: 1px solid #26384D;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .ticket-name {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    .ticket-price {
      color: #D4AF37;
      font-weight: bold;
    }

    .quantity {
      display: flex;
      align-items: center;
      gap: 10px;
      direction: ltr;
    }

    .quantity button {
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 8px;
      background: #D4AF37;
      color: #07111F;
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
    }

    .quantity span {
      min-width: 25px;
      text-align: center;
      font-size: 18px;
    }

    .summary {
      margin-top: 25px;
      padding: 22px;
      background: #0D1B2A;
      border: 1px solid #D4AF37;
      border-radius: 16px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      color: #AEB8C4;
    }

    .total {
      border-top: 1px solid #26384D;
      margin-top: 10px;
      padding-top: 15px;
      font-size: 22px;
      font-weight: bold;
      color: #D4AF37;
    }

    .continue-btn {
      width: 100%;
      margin-top: 20px;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: #D4AF37;
      color: #07111F;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .continue-btn:hover {
      background: #B8963E;
    }

    .empty {
      text-align: center;
      padding: 50px 20px;
      color: #AEB8C4;
    }

    @media (max-width: 600px) {
      .ticket {
        flex-direction: column;
        align-items: stretch;
      }

      .quantity {
        justify-content: center;
      }

      .event-title {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <div class="logo">Ticket arab</div>
  </div>

  <div class="container">

    <div id="eventArea"></div>

    <h2 class="tickets-title">اختر فئة التذكرة</h2>

    <div id="ticketsArea"></div>

    <div class="summary">
      <div class="summary-row">
        <span>عدد التذاكر</span>
        <span id="totalTickets">0</span>
      </div>

      <div class="summary-row total">
        <span>الإجمالي</span>
        <span id="totalPrice">0</span>
      </div>

      <button class="continue-btn" onclick="continueBooking()">
        متابعة الحجز
      </button>
    </div>

  </div>

<script>

const events = {

  amr: {
    title: "عمرو دياب",
    image: "./amr-diab.png",
    date: "7 نوفمبر 2026",

    tickets: [
      ["Regular", 275],
      ["Silver", 375],
      ["Gold", 475],
      ["Diamond / Fan Pit", 575],
      ["Premium", 675],
      ["Premium Diamond", 745],
      ["VIP", 1045]
    ]
  },

  george: {
    title: "جورج وسوف",
    image: "./george-wassouf.png",
    date: "29 أكتوبر 2026",
    location: "Doha Golf Club - الدوحة، قطر",
    currency: "QAR",
    tickets: [
      ["Regular", 199],
      ["Silver", 299],
      ["Gold", 399],
      ["Diamond / Fan Pit", 499],
      ["Premium", 599],
      ["Premium Diamond", 699],
      ["VIP", 849]
    ]
  },

  elissa: {
    title: "إليسا",
    image: "./elissa.png",
    date: "13 نوفمبر 2026",
    location: "OCEC - مسقط، سلطنة عمان",
    currency: "OMR",
    tickets: [
      ["Regular", 25],
      ["Silver", 29],
      ["Gold", 50.20],
      ["Diamond / Fan Pit", 81.60],
      ["Premium", 106],
      ["Premium Diamond", 122],
      ["VIP", 142.50]
    ]
  },

  tamer: {
    title: "تامر عاشور",
    image: "./tamer-ashour.png",
    date: "6 نوفمبر 2026",
    location: "OCEC - مسقط، سلطنة عمان",
    currency: "OMR",
    tickets: [
      ["Regular", 5],
      ["Silver", 10],
      ["Gold", 20],
      ["Diamond / Fan Pit", 25],
      ["Premium", 35],
      ["Premium Diamond", 45],
      ["VIP", 65]
    ]
  },

  tul8te: {
    title: "TUL8TE",
    image: "./tul8te.png",
    date: "23 أكتوبر 2026",
    location: "Beyon Al Dana Amphitheatre - المنامة، البحرين",
    currency: "BHD",
    tickets: [
      ["Regular", 8],
      ["Silver", 12],
      ["Gold", 16],
      ["Diamond / Fan Pit", 20],
      ["Premium", 25],
      ["Premium Diamond", 30],
      ["VIP", 50]
    ]
  },

  fadel: {
    title: "فضل شاكر",
    image: "./fadel-chaker.png",
    date: "22 أكتوبر 2026",
    location: "أبو بكر سالم - الرياض، السعودية",
    currency: "SAR",
    tickets: [
      ["Regular", 455],
      ["Silver", 675],
      ["Gold", 930],
      ["Diamond / Fan Pit", 1480],
      ["Premium", 2825],
      ["Premium Diamond", 3400],
      ["VIP", 3700]
    ]
  },

  nancy: {
    title: "نانسي عجرم",
    image: "./nancy-ajram.png",
    date: "24 أكتوبر 2026",
    location: "Coca-Cola Arena - دبي، الإمارات",
    currency: "AED",
    tickets: [
      ["Regular / Bronze", 190],
      ["Silver", 295],
      ["Gold", 400],
      ["Premium / Platinum", 475],
      ["VIP", 999],
      ["Elevate Deck", 1230],
      ["Royal", 2080]
    ]
  },

  rabeh: {
    title: "رابح صقر",
    image: "./rabeh-saqer.png",
    date: "25 أكتوبر 2026",
    location: "الرياض، السعودية",
    currency: "SAR",
    tickets: [
      ["Regular", 299],
      ["Silver", 399],
      ["Gold", 499],
      ["Diamond / Fan Pit", 599],
      ["Premium", 699],
      ["Premium Diamond", 799],
      ["VIP", 999]
    ]
  },

  ismael: {
    title: "Ismael Dawas Band",
    image: "./ismael-dawas.png",
    date: "14 نوفمبر 2026",
    location: "Dar Al Muharraq - البحرين",
    currency: "BHD",
    tickets: [
      ["Regular", 4.9],
      ["Silver", 7],
      ["Gold", 10],
      ["Diamond / Fan Pit", 13],
      ["Premium", 16],
      ["Premium Diamond", 20],
      ["VIP", 30]
    ]
  }

};


const params = new URLSearchParams(window.location.search);
const eventKey = params.get("event") || "amr";

const event = events[eventKey];

let quantities = [];

if (!event) {

  document.getElementById("eventArea").innerHTML = `
    <div class="empty">
      <h2>الحفلة غير موجودة</h2>
      <p>برجاء العودة واختيار حفلة صحيحة.</p>
    </div>
  `;

} else {

  quantities = new Array(event.tickets.length).fill(0);

  document.getElementById("eventArea").innerHTML = `
    <div class="event-card">

      <img
        src="${event.image}"
        class="event-image"
        alt="${event.title}"
      >

      <div class="event-info">

        <h1 class="event-title">
          ${event.title}
        </h1>

        <div class="event-details">
          📅 ${event.date}<br>
          📍 ${event.location}
        </div>

      </div>

    </div>
  `;

  renderTickets();

}


function renderTickets() {

  const area = document.getElementById("ticketsArea");

  area.innerHTML = "";

  event.tickets.forEach((ticket, index) => {

    const name = ticket[0];
    const price = ticket[1];

    area.innerHTML += `

      <div class="ticket">

        <div>
          <div class="ticket-name">
            ${name}
          </div>

          <div class="ticket-price">
            ${formatPrice(price)} ${event.currency}
          </div>
        </div>

        <div class="quantity">

          <button onclick="changeQuantity(${index}, -1)">
            −
          </button>

          <span id="qty-${index}">
            ${quantities[index]}
          </span>

          <button onclick="changeQuantity(${index}, 1)">
            +
          </button>

        </div>

      </div>

    `;

  });

  updateSummary();

}


function changeQuantity(index, amount) {

  const newValue = quantities[index] + amount;

  if (newValue < 0) {
    return;
  }

  if (newValue > 10) {
    alert("الحد الأقصى 10 تذاكر من نفس الفئة.");
    return;
  }

  quantities[index] = newValue;

  document.getElementById(`qty-${index}`).textContent = newValue;

  updateSummary();

}


function updateSummary() {

  let totalTickets = 0;
  let totalPrice = 0;

  event.tickets.forEach((ticket, index) => {

    const price = ticket[1];
    const quantity = quantities[index];

    totalTickets += quantity;
    totalPrice += price * quantity;

  });

  document.getElementById("totalTickets").textContent =
    totalTickets;

  document.getElementById("totalPrice").textContent =
    `${formatPrice(totalPrice)} ${event.currency}`;

}


function formatPrice(price) {

  if (Number.isInteger(price)) {
    return price;
  }

  return price.toFixed(2);
}


function continueBooking() {

  let selectedTickets = [];
  let totalTickets = 0;
  let totalPrice = 0;

  event.tickets.forEach((ticket, index) => {

    const quantity = quantities[index];

    if (quantity > 0) {

      selectedTickets.push({
        category: ticket[0],
        price: ticket[1],
        quantity: quantity
      });

      totalTickets += quantity;
      totalPrice += ticket[1] * quantity;

    }

  });

  if (totalTickets === 0) {

    alert("من فضلك اختر تذكرة واحدة على الأقل.");

    return;
  }


  const bookingData = {

    event: event.title,

    date: event.date,

    location: event.location,

    currency: event.currency,

    tickets: selectedTickets,

    totalTickets: totalTickets,

    totalPrice: totalPrice

  };


  localStorage.setItem(
    "ticketArabBooking",
    JSON.stringify(bookingData)
  );


  alert(
    `تم اختيار ${totalTickets} تذكرة.\n\nالإجمالي: ${formatPrice(totalPrice)} ${event.currency}\n\nسننتقل للدفع في الخطوة التالية.`
  );

}

</script>

</body>
</html>
