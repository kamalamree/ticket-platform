<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>حجز تذاكر عمرو دياب | Ticket arab</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #07111F;
      color: white;
    }

    .container {
      width: 90%;
      max-width: 1000px;
      margin: auto;
    }

    header {
      padding: 25px 0;
      border-bottom: 1px solid rgba(212, 175, 55, 0.2);
    }

    .logo {
      color: #D4AF37;
      font-size: 28px;
      font-weight: bold;
      text-decoration: none;
    }

    .page {
      padding: 35px 0 60px;
    }

    .event-card {
      background: #0D1B2A;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(212, 175, 55, 0.25);
    }

    .event-image {
      width: 100%;
      display: block;
      max-height: 500px;
      object-fit: cover;
    }

    .content {
      padding: 30px;
    }

    h1 {
      margin-top: 0;
      color: #D4AF37;
      font-size: 32px;
    }

    .event-info {
      color: #AEB8C4;
      line-height: 2;
      margin-bottom: 30px;
    }

    .ticket-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      padding: 16px;
      margin-bottom: 12px;
      background: #07111F;
      border: 1px solid rgba(212, 175, 55, 0.18);
      border-radius: 12px;
    }

    .ticket-name {
      font-size: 17px;
      font-weight: bold;
    }

    .ticket-price {
      color: #D4AF37;
      margin-top: 6px;
      font-size: 15px;
    }

    .quantity {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .quantity button {
      width: 38px;
      height: 38px;
      border: none;
      border-radius: 8px;
      background: #D4AF37;
      color: #07111F;
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
    }

    .quantity span {
      min-width: 25px;
      text-align: center;
      font-size: 18px;
    }

    .summary {
      margin-top: 30px;
      padding: 22px;
      background: #07111F;
      border-radius: 12px;
      border: 1px solid rgba(212, 175, 55, 0.25);
    }

    .summary-line {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .total {
      color: #D4AF37;
      font-size: 22px;
      font-weight: bold;
      border-top: 1px solid rgba(212, 175, 55, 0.2);
      padding-top: 15px;
      margin-top: 15px;
    }

    .continue-btn {
      width: 100%;
      margin-top: 20px;
      padding: 16px;
      border: none;
      border-radius: 10px;
      background: #D4AF37;
      color: #07111F;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .back {
      display: inline-block;
      margin-bottom: 20px;
      color: #AEB8C4;
      text-decoration: none;
    }

    .back:hover {
      color: #D4AF37;
    }

    @media (max-width: 600px) {
      .content {
        padding: 20px;
      }

      h1 {
        font-size: 25px;
      }

      .ticket-row {
        flex-direction: column;
        align-items: stretch;
      }

      .quantity {
        justify-content: flex-end;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="container">
    <a href="index.html" class="logo">Ticket arab</a>
  </div>
</header>

<main class="page">
  <div class="container">

    <a href="index.html" class="back">← العودة للحفلات</a>

    <div class="event-card">

      <img
        src="amr-diab.png"
        alt="عمرو دياب"
        class="event-image"
      >

      <div class="content">

        <h1>عمرو دياب</h1>

        <div class="event-info">
          📅 الجمعة 7 نوفمبر 2026<br>
          📍 Coca-Cola Arena – Dubai, UAE
        </div>

        <h2>اختر فئة التذكرة</h2>

        <div class="ticket-row">
          <div>
            <div class="ticket-name">Regular</div>
            <div class="ticket-price">275 AED</div>
          </div>

          <div class="quantity">
            <button onclick="changeQuantity('regular', -1)">−</button>
            <span id="regular">0</span>
            <button onclick="changeQuantity('regular', 1)">+</button>
          </div>
        </div>

        <div class="ticket-row">
          <div>
            <div class="ticket-name">Silver</div>
            <div class="ticket-price">375 AED</div>
          </div>

          <div class="quantity">
            <button onclick="changeQuantity('silver', -1)">−</button>
            <span id="silver">0</span>
            <button onclick="changeQuantity('silver', 1)">+</button>
          </div>
        </div>

        <div class="ticket-row">
          <div>
            <div class="ticket-name">Gold</div>
            <div class="ticket-price">475 AED</div>
          </div>

          <div class="quantity">
            <button onclick="changeQuantity('gold', -1)">−</button>
            <span id="gold">0</span>
            <button onclick="changeQuantity('gold', 1)">+</button>
          </div>
        </div>

        <div class="ticket-row">
          <div>
            <div class="ticket-name">Diamond / Fan Pit</div>
            <div class="ticket-price">575 AED</div>
          </div>

          <div class="quantity">
            <button onclick="changeQuantity('diamond', -1)">−</button>
            <span id="diamond">0</span>
            <button onclick="changeQuantity('diamond', 1)">+</button>
          </div>
        </div>

        <div class="ticket-row">
          <div>
            <div class="ticket-name">Premium</div>
            <div class="ticket-price">675 AED</div>
          </div>

          <div class="quantity">
            <button onclick="changeQuantity('premium', -1)">−</button>
            <span id="premium">0</span>
            <button onclick="changeQuantity('premium', 1)">+</button>
          </div>
        </div>

        <div class="ticket-row">
          <div>
            <div class="ticket-name">Premium Diamond</div>
            <div class="ticket-price">745 AED</div>
          </div>

          <div class="quantity">
            <button onclick="changeQuantity('premiumDiamond', -1)">−</button>
            <span id="premiumDiamond">0</span>
            <button onclick="changeQuantity('premiumDiamond', 1)">+</button>
          </div>
        </div>

        <div class="ticket-row">
          <div>
            <div class="ticket-name">VIP</div>
            <div class="ticket-price">1045 AED</div>
          </div>

          <div class="quantity">
            <button onclick="changeQuantity('vip', -1)">−</button>
            <span id="vip">0</span>
            <button onclick="changeQuantity('vip', 1)">+</button>
          </div>
        </div>

        <div class="summary">

          <div class="summary-line">
            <span>عدد التذاكر</span>
            <span id="totalTickets">0</span>
          </div>

          <div class="summary-line total">
            <span>الإجمالي</span>
            <span id="totalPrice">0 AED</span>
          </div>

          <button class="continue-btn" onclick="continueBooking()">
            متابعة الحجز
          </button>

        </div>

      </div>
    </div>

  </div>
</main>

<script>

  const prices = {
    regular: 275,
    silver: 375,
    gold: 475,
    diamond: 575,
    premium: 675,
    premiumDiamond: 745,
    vip: 1045
  };

  const quantities = {
    regular: 0,
    silver: 0,
    gold: 0,
    diamond: 0,
    premium: 0,
    premiumDiamond: 0,
    vip: 0
  };

  function changeQuantity(type, amount) {

    let newQuantity = quantities[type] + amount;

    if (newQuantity < 0) {
      newQuantity = 0;
    }

    if (newQuantity > 10) {
      newQuantity = 10;
    }

    quantities[type] = newQuantity;

    document.getElementById(type).textContent = newQuantity;

    updateSummary();
  }

  function updateSummary() {

    let totalTickets = 0;
    let totalPrice = 0;

    for (const type in quantities) {

      totalTickets += quantities[type];

      totalPrice += quantities[type] * prices[type];

    }

    document.getElementById("totalTickets").textContent = totalTickets;

    document.getElementById("totalPrice").textContent =
      totalPrice + " AED";
  }

  function continueBooking() {

    let totalTickets = 0;
    let totalPrice = 0;

    for (const type in quantities) {

      totalTickets += quantities[type];

      totalPrice += quantities[type] * prices[type];

    }

    if (totalTickets === 0) {

      alert("من فضلك اختر تذكرة واحدة على الأقل.");

      return;
    }

    localStorage.setItem(
      "ticketArabBooking",
      JSON.stringify({
        event: "Amr Diab",
        date: "7 November 2026",
        location: "Coca-Cola Arena, Dubai",
        currency: "AED",
        quantities: quantities,
        totalTickets: totalTickets,
        totalPrice: totalPrice
      })
    );

    alert(
      "تم حفظ اختيارك بنجاح.\n\n" +
      "عدد التذاكر: " + totalTickets +
      "\nالإجمالي: " + totalPrice + " AED"
    );
  }

</script>

</body>
</html>
