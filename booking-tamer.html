<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>حجز تامر عاشور | Ticket arab</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Tahoma, sans-serif;
    }

    body {
      background: #07111f;
      color: #ffffff;
      min-height: 100vh;
    }

    header {
      background: #0b1728;
      border-bottom: 1px solid #c9a44c;
      padding: 18px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      color: #d8b45a;
      font-size: 26px;
      font-weight: bold;
    }

    .back {
      color: #ffffff;
      text-decoration: none;
      font-size: 15px;
    }

    .back:hover {
      color: #d8b45a;
    }

    .container {
      width: 92%;
      max-width: 1100px;
      margin: 40px auto;
    }

    .event-box {
      background: #0d1b2e;
      border: 1px solid rgba(216, 180, 90, 0.35);
      border-radius: 18px;
      padding: 25px;
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 30px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
    }

    .poster {
      width: 100%;
      height: 480px;
      object-fit: cover;
      border-radius: 14px;
      display: block;
    }

    .event-info h1 {
      color: #d8b45a;
      font-size: 30px;
      margin-bottom: 12px;
    }

    .event-details {
      color: #c8d0dc;
      line-height: 1.9;
      margin-bottom: 25px;
      font-size: 15px;
    }

    .ticket-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .ticket-row {
      background: #111f33;
      border: 1px solid rgba(216, 180, 90, 0.2);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .ticket-name {
      font-weight: bold;
      font-size: 15px;
      margin-bottom: 5px;
    }

    .ticket-price {
      color: #d8b45a;
      font-weight: bold;
      white-space: nowrap;
    }

    .counter {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .counter button {
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 8px;
      background: #d8b45a;
      color: #07111f;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    .counter button:hover {
      background: #f0cf77;
    }

    .counter span {
      min-width: 20px;
      text-align: center;
      font-weight: bold;
    }

    .email-box {
      margin-top: 25px;
    }

    .email-box label {
      display: block;
      margin-bottom: 8px;
      color: #d8b45a;
      font-weight: bold;
    }

    .email-box input {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #34465e;
      background: #081526;
      color: white;
      outline: none;
      font-size: 15px;
    }

    .email-box input:focus {
      border-color: #d8b45a;
    }

    .total-box {
      margin-top: 22px;
      background: #081526;
      border: 1px solid rgba(216, 180, 90, 0.35);
      border-radius: 12px;
      padding: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .total-title {
      font-size: 17px;
      font-weight: bold;
    }

    .total {
      color: #d8b45a;
      font-size: 24px;
      font-weight: bold;
    }

    .continue-btn {
      width: 100%;
      margin-top: 18px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #d8b45a;
      color: #07111f;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .continue-btn:hover {
      background: #f0cf77;
    }

    @media (max-width: 800px) {
      .event-box {
        grid-template-columns: 1fr;
      }

      .poster {
        height: auto;
        max-height: 600px;
        object-fit: contain;
        background: #081526;
      }

      .event-info h1 {
        font-size: 25px;
      }
    }

    @media (max-width: 500px) {
      header {
        padding: 15px 4%;
      }

      .logo {
        font-size: 22px;
      }

      .container {
        width: 94%;
        margin: 25px auto;
      }

      .event-box {
        padding: 16px;
      }

      .ticket-row {
        flex-wrap: wrap;
      }

      .ticket-price {
        margin-right: auto;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="logo">
    Ticket arab
  </div>

  <a href="./index.html" class="back">
    ← العودة للحفلات
  </a>

</header>


<div class="container">

  <div class="event-box">

    <img
      src="./tamer-ashour.png"
      alt="Tamer Ashour"
      class="poster"
    >


    <div class="event-info">

      <h1>
        حفل تامر عاشور في مسقط
      </h1>


      <div class="event-details">

        <div>
          📅 الجمعة 6 نوفمبر 2026
        </div>

        <div>
          📍 OCEC - Muscat, Oman
        </div>

        <div>
          🎤 حفل تامر عاشور
        </div>

      </div>


      <div class="ticket-list">


        <!-- Regular -->

        <div class="ticket-row">

          <div>
            <div class="ticket-name">Regular</div>
            <div class="ticket-price">10 OMR</div>
          </div>

          <div class="counter">
            <button onclick="changeQty(0, -1)">−</button>
            <span id="qty0">0</span>
            <button onclick="changeQty(0, 1)">+</button>
          </div>

        </div>


        <!-- Silver -->

        <div class="ticket-row">

          <div>
            <div class="ticket-name">Silver</div>
            <div class="ticket-price">15 OMR</div>
          </div>

          <div class="counter">
            <button onclick="changeQty(1, -1)">−</button>
            <span id="qty1">0</span>
            <button onclick="changeQty(1, 1)">+</button>
          </div>

        </div>


        <!-- Gold -->

        <div class="ticket-row">

          <div>
            <div class="ticket-name">Gold</div>
            <div class="ticket-price">20 OMR</div>
          </div>

          <div class="counter">
            <button onclick="changeQty(2, -1)">−</button>
            <span id="qty2">0</span>
            <button onclick="changeQty(2, 1)">+</button>
          </div>

        </div>


        <!-- Platinum -->

        <div class="ticket-row">

          <div>
            <div class="ticket-name">Platinum</div>
            <div class="ticket-price">25 OMR</div>
          </div>

          <div class="counter">
            <button onclick="changeQty(3, -1)">−</button>
            <span id="qty3">0</span>
            <button onclick="changeQty(3, 1)">+</button>
          </div>

        </div>


        <!-- Premium -->

        <div class="ticket-row">

          <div>
            <div class="ticket-name">Premium</div>
            <div class="ticket-price">35 OMR</div>
          </div>

          <div class="counter">
            <button onclick="changeQty(4, -1)">−</button>
            <span id="qty4">0</span>
            <button onclick="changeQty(4, 1)">+</button>
          </div>

        </div>


        <!-- Premium VIP -->

        <div class="ticket-row">

          <div>
            <div class="ticket-name">Premium VIP</div>
            <div class="ticket-price">45 OMR</div>
          </div>

          <div class="counter">
            <button onclick="changeQty(5, -1)">−</button>
            <span id="qty5">0</span>
            <button onclick="changeQty(5, 1)">+</button>
          </div>

        </div>


        <!-- VIP -->

        <div class="ticket-row">

          <div>
            <div class="ticket-name">VIP</div>
            <div class="ticket-price">65 OMR</div>
          </div>

          <div class="counter">
            <button onclick="changeQty(6, -1)">−</button>
            <span id="qty6">0</span>
            <button onclick="changeQty(6, 1)">+</button>
          </div>

        </div>

      </div>


      <div class="email-box">

        <label for="email">
          البريد الإلكتروني
        </label>

        <input
          type="email"
          id="email"
          placeholder="example@email.com"
        >

      </div>


      <div class="total-box">

        <div class="total-title">
          الإجمالي
        </div>

        <div class="total">
          <span id="total">0</span>
          OMR
        </div>

      </div>


      <button
        class="continue-btn"
        onclick="continueBooking()"
      >
        متابعة الحجز
      </button>

    </div>

  </div>

</div>


<script>

  const prices = [
    10,
    15,
    20,
    25,
    35,
    45,
    65
  ];


  const quantities = [
    0,
    0,
    0,
    0,
    0,
    0,
    0
  ];


  function changeQty(index, amount) {

    let newValue =
      quantities[index] + amount;


    if (newValue < 0) {
      newValue = 0;
    }


    if (newValue > 10) {
      newValue = 10;
    }


    quantities[index] = newValue;


    document.getElementById(
      "qty" + index
    ).textContent = newValue;


    calculateTotal();

  }


  function calculateTotal() {

    let total = 0;


    for (
      let i = 0;
      i < prices.length;
      i++
    ) {

      total +=
        prices[i] * quantities[i];

    }


    document.getElementById(
      "total"
    ).textContent =
      total.toLocaleString(
        "en-US",
        {
          maximumFractionDigits: 2
        }
      );

  }


  function continueBooking() {

    const totalTickets =
      quantities.reduce(
        (sum, value) =>
          sum + value,
        0
      );


    const email =
      document
        .getElementById("email")
        .value
        .trim();


    if (totalTickets === 0) {

      alert(
        "من فضلك اختر تذكرة واحدة على الأقل."
      );

      return;
    }


    if (!email) {

      alert(
        "من فضلك اكتب البريد الإلكتروني."
      );

      return;
    }


    const emailPattern =
      /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


    if (!emailPattern.test(email)) {

      alert(
        "من فضلك اكتب بريد إلكتروني صحيح."
      );

      return;
    }


    const total =
      quantities.reduce(
        (sum, qty, index) =>
          sum +
          qty * prices[index],
        0
      );


    alert(
      "تم تسجيل طلب الحجز بنجاح.\n\n" +
      "الإجمالي: " +
      total.toLocaleString("en-US") +
      " OMR\n\n" +
      "سيتم إضافة الدفع الإلكتروني لاحقًا."
    );

  }

</script>

</body>
</html>
